<div class="toolbar" role="toolbar" aria-label="Diagram actions">
  <button id="btn-theme" type="button" title="Toggle theme (T)" aria-label="Toggle color theme" aria-pressed="false">
    <span id="theme-icon" class="toolbar-icon" aria-hidden="true"></span>
    <span id="theme-label">Dark</span>
  </button>
  <button id="btn-motion" type="button" hidden title="Pause motion" aria-label="Pause motion" aria-pressed="true">
    <span class="motion-control-dot" aria-hidden="true"></span>
    <span id="motion-label">Live</span>
  </button>
  <button
    id="btn-present"
    type="button"
    title="Presentation stage (F)"
    aria-label="Enter presentation stage"
    aria-pressed="false"
  >
    <span id="present-icon" class="toolbar-icon" aria-hidden="true"></span>
    <span id="present-label">Present</span>
  </button>
</div>
