name: Deploy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Cloudflare
    environment:
      name: production
      url: ${{ steps.publish.outputs.deployment-url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Stage the release
        run: |
          mkdir -p release
          cp wrangler.jsonc release/wrangler.jsonc
      - name: Download release bundle (v8.0.1)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-bundle
          path: release/dist
      - name: Publish (v4.0.0)
        id: publish
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: npm
          workingDirectory: release
