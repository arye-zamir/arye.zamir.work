name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  cancel-in-progress: false
  group: deploy-${{ github.workflow }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    environment:
      name: production
      url: ${{ steps.publish.outputs.deployment-url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm (v6.1.0)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: pnpm
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve release identifier
        run: echo "VITE_APP_VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Quality gate and production build
        run: pnpm check
      - name: Publish (v4.0.0)
        id: publish
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
