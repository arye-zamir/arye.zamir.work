name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.13.0
          - 24
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm (v6.1.0)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: pnpm
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve release identifier
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VITE_APP_VERSION=${GITHUB_REF_NAME#v}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Upload release bundle (v7.0.1)
        if: matrix.node-version == 24 && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: release-bundle
          path: dist
          retention-days: 1

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm (v6.1.0)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: pnpm
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm security

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Review dependency changes (v5.0.0)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  deploy:
    name: Deploy
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - quality
      - security
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/deploy.yml
