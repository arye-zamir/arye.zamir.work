name: Factory

on:
  issues:
    types:
      - labeled

concurrency:
  cancel-in-progress: false
  group: factory-${{ github.event.issue.number }}

permissions:
  contents: read

env:
  PI_VERSION: 0.84.3

jobs:
  eligibility:
    name: Eligibility
    if: >-
      github.event.label.name == 'factory:ready'
      && github.repository_owner == 'arye-zamir'
      && github.event.issue.user.login == github.repository_owner
      && github.event.issue.author_association == 'OWNER'
      && github.actor == github.repository_owner
      && github.triggering_actor == github.repository_owner
      && !contains(github.event.issue.labels.*.name, 'no-agent')
      && !contains(github.event.issue.labels.*.name, 'security')
      && !contains(github.event.issue.labels.*.name, 'migration')
      && !contains(github.event.issue.labels.*.name, 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert the owner authored and triggered this run
        env:
          ASSOCIATION: ${{ github.event.issue.author_association }}
          AUTHOR: ${{ github.event.issue.user.login }}
          LABELLER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for actual in "$AUTHOR" "$LABELLER"; do
            if [ "$actual" != "$OWNER" ]; then
              echo "refused: expected $OWNER, got $actual"
              exit 1
            fi
          done
          if [ "$ASSOCIATION" != "OWNER" ]; then
            echo "refused: author_association is $ASSOCIATION"
            exit 1
          fi
      - name: Verify the release token before anything depends on it
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "refused: FACTORY_TOKEN is not set"
            exit 1
          fi
          if ! gh api "repos/$REPOSITORY" --jq '.permissions.push' | grep -qx true; then
            echo "refused: FACTORY_TOKEN cannot push to $REPOSITORY; it needs Contents: read and write"
            exit 1
          fi
          echo "FACTORY_TOKEN can push; the release tag will trigger the deploy"

  agent:
    name: Agent
    needs:
      - eligibility
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm (v6.1.0)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: pnpm
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage the task packet
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          mkdir -p "$RUNNER_TEMP/task"
          printf '%s' "$ISSUE_TITLE" > "$RUNNER_TEMP/task/title.txt"
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/task/body.md"
          printf 'agent/%s\n' "$ISSUE_NUMBER" > "$RUNNER_TEMP/task/branch.txt"
          cp factory/policy.json "$RUNNER_TEMP/task/policy.json"
          wc -c "$RUNNER_TEMP/task/body.md"
      - name: Write the agent brief
        run: |
          node factory/brief.mjs > "$RUNNER_TEMP/task/brief.md"
          cat "$RUNNER_TEMP/task/brief.md"
      - name: Run the agent, escalating once if the patch leaves scope
        env:
          DEFAULT_MODEL: ${{ vars.FACTORY_MODEL_DEFAULT }}
          ESCALATION_MODEL: ${{ vars.FACTORY_MODEL_ESCALATION }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          npm i -g "@earendil-works/pi-coding-agent@$PI_VERSION"
          task="$RUNNER_TEMP/task"
          for model in "$DEFAULT_MODEL" "$ESCALATION_MODEL"; do
            echo "::group::attempt with $model"
            git checkout -- .
            git clean -qfd
            timeout 900 pi --print \
              --provider openrouter \
              --model "$model" \
              --tools read,edit,write \
              --no-session \
              --no-context-files \
              -- \
              "@$task/brief.md" \
              "@$task/title.txt" \
              "@$task/body.md" || true
            git add -A
            git diff --cached > "$task/patch.diff"
            if [ ! -s "$task/patch.diff" ]; then
              echo "::endgroup::"
              echo "$model changed nothing"
              continue
            fi
            git stash --quiet --staged
            if node factory/check-scope.mjs "$task/patch.diff"; then
              git stash pop --quiet
              echo "$model" > "$task/model.txt"
              echo "::endgroup::"
              exit 0
            fi
            git stash drop --quiet
            echo "::endgroup::"
            echo "$model produced an out-of-scope patch"
          done
          echo "both models failed to produce an in-scope patch"
          exit 1
      - name: Run the repository gate
        run: pnpm check
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          branch=$(cat "$RUNNER_TEMP/task/branch.txt")
          model=$(cat "$RUNNER_TEMP/task/model.txt")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -q -m "fix: apply the change requested in issue #$ISSUE_NUMBER"
          git push -u origin "$branch"
          {
            printf 'Requested in issue #%s.\n\n' "$ISSUE_NUMBER"
            printf 'Model: `%s`\n\n' "$model"
            printf 'Scope was checked against `factory/policy.json` on the base revision.\n'
            printf 'This pull request does not close the issue; verification does.\n'
          } > "$RUNNER_TEMP/task/pr.md"
          gh pr create --base main --head "$branch" \
            --title "fix: issue #$ISSUE_NUMBER" \
            --body-file "$RUNNER_TEMP/task/pr.md"
          gh issue edit "$ISSUE_NUMBER" --add-label 'factory:pr-open' --remove-label 'factory:ready'
      - name: Report a refusal on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label 'factory:blocked' --remove-label 'factory:ready'
          gh issue comment "$ISSUE_NUMBER" --body "The factory refused this request. No branch or pull request was created, and nothing was deployed. Run: $RUN_URL"
