name: Factory scope

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Approved scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the base revision (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Setup Node (v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Check the patch against the policy
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$HEAD_REF" in
            agent/*) ;;
            *) echo "not a factory branch; policy does not apply"; exit 0 ;;
          esac
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "refused: factory branch from a fork"
            exit 1
          fi
          gh pr diff "$PULL_REQUEST" --repo "$REPOSITORY" > "$RUNNER_TEMP/patch.diff"
          node factory/check-scope.mjs "$RUNNER_TEMP/patch.diff"
